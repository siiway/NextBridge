name: Ruff + Ty Auto Fix

on:
  push:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "uv.lock"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "uv.lock"
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Force official PyPI to avoid inherited mirror settings on runners.
      PIP_INDEX_URL: https://pypi.org/simple
      UV_INDEX_URL: https://pypi.org/simple

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install Ruff & Run Fix (lint issues)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --fix --output-format=github"

      - name: Run Ruff format
        run: ruff format --output-format=github

      - name: Run Ty check
        run: uv run ty check --output-format=github

      - name: Auto commit fixes with Verified badge
        uses: siiway/verified_bot_commit@v0.2
        with:
          message: "[skip ci] style: code auto-fix & format"
          files: |
            *.py
            **/*.py
          ref: ${{ github.head_ref || github.ref }}
          if-no-commit: notice
