<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <link rel="icon" href="https://icons.siiway.org/nextbridge/favicon/favicon.ico" />
  <link rel="shortcut icon" href="https://icons.siiway.org/nextbridge/favicon/favicon.ico" />
  <style>
    :root {
      --bg-1: #f2f3f5;
      --bg-2: #f2f3f5;
      --paper: #ffffff;
      --paper-strong: #ffffff;
      --ink: #000000;
      --muted: #888888;
      --line: rgba(0, 0, 0, 0.1);
      --accent: #555555;
      --chip: rgba(0, 0, 0, 0.05);
      --danger: #ff5252;
      --danger-bg: rgba(255, 82, 82, .1);
      --head-bg: #f2f3f5;
      --head-title: #000000;
      --countdown: #888888;
      --status-bg: rgba(0, 0, 0, 0.05);
      --status-text: #333333;
      --status-destroyed-border: #ff5252;
      --msg-time: #999999;
      --content-bg: #ffffff;
      --content-text: #000000;
      --reply-title: #555555;
      --fwd-image-bg: #ffffff;
      --asset-color: #0088cc;
      --asset-hover: #005580;
      --asset-disabled: #aaaaaa;
      --nested-title: #333333;
      --nested-arrow: #666666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-1: #1e1e1e;
        --bg-2: #1e1e1e;
        --paper: #333333;
        --paper-strong: #333333;
        --ink: #e0e0e0;
        --muted: #888888;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #aaaaaa;
        --chip: rgba(255, 255, 255, 0.1);
        --danger: #ff9c92;
        --danger-bg: rgba(255, 122, 104, .16);
        --head-bg: #1e1e1e;
        --head-title: #ffffff;
        --countdown: #aaaaaa;
        --status-bg: rgba(255, 255, 255, 0.1);
        --status-text: #ffffff;
        --status-destroyed-border: #e1beb7;
        --msg-time: #666666;
        --content-bg: #2b2b2b;
        --content-text: #ffffff;
        --reply-title: #c8d9f2;
        --fwd-image-bg: #ffffff;
        --asset-color: var(--asset-color);
        --asset-hover: #d4f7ff;
        --asset-disabled: #7f97b9;
        --nested-title: #bdefff;
        --nested-arrow: #9fdcf1;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-1);
      color: var(--ink);
      font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 0;
    }
    .head {
      background: var(--head-bg);
      padding: 18px 20px;
      margin-bottom: 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--head-title);
    }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta.sub {
      margin-top: 3px;
      font-size: 12px;
      opacity: .95;
    }
    .meta.sub:empty {
      display: none;
    }
    .destroy-countdown {
      color: var(--countdown);
    }
    .status-chip {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--status-bg);
      color: var(--head-title);
      font-size: 12px;
      vertical-align: middle;
    }
    .status-chip.is-destroyed {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--status-destroyed-border);
    }
    .msg {
      padding: 10px 16px;
      margin: 0;
      display: flex;
      gap: 12px;
    }
    .sender {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .avatar-wrapper {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: none;
      display: block;
    }
    .sender-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .sender-main {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: normal;
      display: flex;
      align-items: center;
    }
    .msg-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--msg-time);
    }
    .sender-sub {
      display: none;
    }
    .content-wrapper {
      background: var(--content-bg);
      border-radius: 8px;
      border-top-left-radius: 0;
      padding: 10px 14px;
      width: fit-content;
      max-width: 100%;
    }
    .content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.6;
      color: var(--head-title);
    }
    .reply-preview {
      margin: 0 0 10px;
      padding: 6px 10px;
      border: 1px solid rgba(123, 194, 255, .2);
      border-left: 3px solid rgba(157, 214, 255, .75);
      border-radius: 9px;
      background: rgba(255, 255, 255, .03);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reply-preview::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(157, 214, 255, .95);
      flex: 0 0 auto;
    }
    .reply-preview-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--reply-title);
      line-height: 1.3;
      letter-spacing: .2px;
    }
    .cqface {
      height: 1.25em;
      width: 1.25em;
      vertical-align: -0.18em;
      object-fit: contain;
    }
    .fwd-image {
      display: block;
      max-width: 100%;
      max-height: 480px;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin: 8px 0;
      background: var(--fwd-image-bg);
      object-fit: contain;
    }
    .fwd-image-link {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      line-height: 0;
      border-bottom: none;
      text-decoration: none;
      vertical-align: top;
    }
    .fwd-image-link:hover {
      border-bottom: none;
    }
    .fwd-image-open {
      cursor: zoom-in;
    }
    .fwd-image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 84px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px dashed rgba(159, 220, 241, .35);
      margin: 8px 0;
      background: rgba(255, 255, 255, .04);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .chip {
      display: inline-block;
      font-size: 12px;
      color: var(--asset-color);
      background: var(--chip);
      border: 1px solid rgba(123, 194, 255, .33);
      border-radius: 999px;
      padding: 2px 8px;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    a.asset {
      color: var(--asset-color);
      text-decoration: none;
      border-bottom: 1px dashed rgba(159, 220, 241, .55);
    }
    a.asset:hover {
      color: var(--asset-hover);
      border-bottom-color: var(--asset-hover);
    }
    .media-block {
      margin: 8px 0;
    }
    .media-player {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 8px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
    }
    .media-video {
      max-width: 100%;
    }
    .file-block {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(123, 194, 255, .2);
      background: rgba(24, 36, 56, .52);
    }
    .file-name {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      margin: 2px 0 4px;
      word-break: break-word;
    }
    .file-meta {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 8px;
      word-break: break-all;
    }
    .asset.disabled {
      color: var(--asset-disabled);
      border-bottom: 1px dashed rgba(127, 151, 185, .45);
      pointer-events: none;
      cursor: not-allowed;
    }
    .nested-forward {
      margin: 10px 0 6px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(123, 194, 255, .22);
      background: rgba(15, 24, 39, .55);
    }
    .nested-forward-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--nested-title);
      letter-spacing: .2px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      margin: 0;
    }
    .nested-forward-title::-webkit-details-marker {
      display: none;
    }
    .nested-forward-title::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      color: var(--asset-color);
      transition: transform .18s ease;
    }
    .nested-forward[open] .nested-forward-title {
      margin-bottom: 8px;
    }
    .nested-forward[open] .nested-forward-title::before {
      transform: rotate(90deg);
    }
    .nested-forward-body .msg {
      margin: 8px 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="head">
      <h1>$title<span class="status-chip $page_state">$page_state_text</span></h1>
      <div class="meta">$meta_primary</div>
      <div class="meta sub">$meta_secondary<span id="destroy-countdown" class="destroy-countdown" data-created-at="$created_at_epoch" data-expires-at="$expires_at_epoch" data-destroyed-at="$destroyed_at_epoch"></span></div>
      <div class="meta sub">$meta_attachment</div>
    </section>
    <section>$body</section>
  </main>
  <script>
    (function () {
      var countdown = document.getElementById("destroy-countdown");
      if (!countdown) return;
      var expiresAt = parseInt(countdown.getAttribute("data-expires-at") || "", 10);
      if (!Number.isFinite(expiresAt) || expiresAt <= 0) return;
      var destroyedAt = parseInt(
        countdown.getAttribute("data-destroyed-at") || "",
        10
      );
      var statusChip = document.querySelector(".status-chip");
      var timer = null;

      function formatDuration(seconds) {
        var remain = Math.max(0, Math.floor(seconds));
        var days = Math.floor(remain / 86400);
        remain = remain % 86400;
        var hours = Math.floor(remain / 3600);
        remain = remain % 3600;
        var minutes = Math.floor(remain / 60);
        var secs = remain % 60;
        var parts = [];
        if (days > 0) parts.push(days + "天");
        if (hours > 0 || parts.length > 0) parts.push(hours + "小时");
        if (minutes > 0 || parts.length > 0) parts.push(minutes + "分钟");
        parts.push(secs + "秒");
        return parts.join("");
      }

      function setDestroyed() {
        countdown.textContent = " · 已销毁";
        if (statusChip) {
          statusChip.textContent = "已销毁";
          statusChip.classList.add("is-destroyed");
          statusChip.classList.remove("active");
        }
      }

      if (Number.isFinite(destroyedAt) && destroyedAt > 0) {
        setDestroyed();
        return;
      }

      function tick() {
        var now = Math.floor(Date.now() / 1000);
        var remain = expiresAt - now;
        if (remain <= 0) {
          setDestroyed();
          if (timer) clearInterval(timer);
          return;
        }
        countdown.textContent = " · 距离销毁约 " + formatDuration(remain);
      }

      tick();
      timer = setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
