<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <link rel="icon" href="https://icons.siiway.org/nextbridge/favicon/favicon.ico" />
  <link rel="shortcut icon" href="https://icons.siiway.org/nextbridge/favicon/favicon.ico" />
  <script>
    (function () {
      var themeKey = "nextbridge.qq_forward.theme_mode";
      var modeKey = "nextbridge.qq_forward.forward_mode";

      function safeGet(key, fallback) {
        try {
          var value = localStorage.getItem(key);
          return value || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function resolveTheme(mode) {
        if (mode === "light" || mode === "dark") return mode;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      var themeMode = safeGet(themeKey, "system");
      if (themeMode !== "system" && themeMode !== "light" && themeMode !== "dark") {
        themeMode = "system";
      }

      var forwardMode = safeGet(modeKey, "nested");
      if (forwardMode !== "nested" && forwardMode !== "page") {
        forwardMode = "nested";
      }

      var root = document.documentElement;
      root.dataset.themeMode = themeMode;
      root.dataset.theme = resolveTheme(themeMode);
      root.dataset.forwardMode = forwardMode;
    })();
  </script>
  <style>
    :root {
      --bg-1: #f2f3f5;
      --bg-2: #f2f3f5;
      --paper: #ffffff;
      --paper-strong: #ffffff;
      --ink: #000000;
      --muted: #888888;
      --line: rgba(0, 0, 0, 0.1);
      --accent: #555555;
      --chip: rgba(0, 0, 0, 0.05);
      --danger: #ff5252;
      --danger-bg: rgba(255, 82, 82, .1);
      --head-bg: #f2f3f5;
      --head-title: #000000;
      --countdown: #888888;
      --status-bg: rgba(0, 0, 0, 0.05);
      --status-text: #333333;
      --status-destroyed-border: #ff5252;
      --msg-time: #999999;
      --content-bg: #ffffff;
      --content-text: #000000;
      --reply-title: #555555;
      --fwd-image-bg: #ffffff;
      --asset-color: var(--accent);
      --asset-hover: #333333;
      --asset-disabled: #aaaaaa;
      --nested-title: var(--ink);
      --nested-arrow: var(--muted);
    }
    html[data-theme="dark"] {
        --bg-1: #1e1e1e;
        --bg-2: #1e1e1e;
        --paper: #333333;
        --paper-strong: #333333;
        --ink: #e0e0e0;
        --muted: #888888;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #aaaaaa;
        --chip: rgba(255, 255, 255, 0.1);
        --danger: #ff9c92;
        --danger-bg: rgba(255, 122, 104, .16);
        --head-bg: #1e1e1e;
        --head-title: #ffffff;
        --countdown: #aaaaaa;
        --status-bg: rgba(255, 255, 255, 0.1);
        --status-text: #ffffff;
        --status-destroyed-border: #e1beb7;
        --msg-time: #666666;
        --content-bg: #2b2b2b;
        --content-text: #ffffff;
        --reply-title: #c8d9f2;
        --fwd-image-bg: #ffffff;
        --asset-color: var(--accent);
        --asset-hover: var(--ink);
        --asset-disabled: #888888;
        --nested-title: var(--ink);
        --nested-arrow: var(--muted);
    }
    html[data-theme="light"] {
      --bg-1: #f2f3f5;
      --bg-2: #f2f3f5;
      --paper: #ffffff;
      --paper-strong: #ffffff;
      --ink: #000000;
      --muted: #888888;
      --line: rgba(0, 0, 0, 0.1);
      --accent: #555555;
      --chip: rgba(0, 0, 0, 0.05);
      --danger: #ff5252;
      --danger-bg: rgba(255, 82, 82, .1);
      --head-bg: #f2f3f5;
      --head-title: #000000;
      --countdown: #888888;
      --status-bg: rgba(0, 0, 0, 0.05);
      --status-text: #333333;
      --status-destroyed-border: #ff5252;
      --msg-time: #999999;
      --content-bg: #ffffff;
      --content-text: #000000;
      --reply-title: #555555;
      --fwd-image-bg: #ffffff;
      --asset-color: var(--accent);
      --asset-hover: #333333;
      --asset-disabled: #aaaaaa;
      --nested-title: var(--ink);
      --nested-arrow: var(--muted);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-1);
      color: var(--ink);
      font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 0;
    }
    .page.is-hidden {
      display: none;
    }
    .head {
      background: var(--head-bg);
      padding: 18px 20px;
      margin-bottom: 14px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
    }
    .settings-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 70;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--head-title);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    }
    .settings-toggle:hover {
      background: var(--chip);
    }
    .settings-overlay,
    .forward-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-1);
    }
    .settings-overlay {
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .forward-overlay {
      z-index: 80;
      display: flex;
      flex-direction: column;
    }
    .settings-overlay[hidden],
    .forward-overlay[hidden] {
      display: none;
    }
    .settings-dialog {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .28);
      padding: 18px;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .settings-title {
      margin: 0;
      font-size: 16px;
      color: var(--head-title);
    }
    .settings-close,
    .forward-back {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--head-title);
      border-radius: 8px;
      cursor: pointer;
    }
    .settings-close {
      padding: 6px 12px;
    }
    .settings-list {
      display: grid;
      gap: 14px;
    }
    .setting-row {
      display: grid;
      gap: 8px;
    }
    .setting-label {
      font-size: 13px;
      color: var(--muted);
    }
    .setting-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg-1);
      color: var(--ink);
      padding: 10px 12px;
    }
    .setting-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .forward-overlay-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--head-bg);
    }
    .forward-back {
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 18px;
      flex: 0 0 auto;
    }
    .forward-overlay-title {
      min-width: 0;
      flex: 1;
      font-size: 14px;
      color: var(--head-title);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .forward-overlay-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 24px;
    }
    body.is-modal-open {
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--head-title);
    }
    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta.sub {
      margin-top: 3px;
      font-size: 12px;
      opacity: .95;
    }
    .meta.sub:empty {
      display: none;
    }
    .destroy-countdown {
      color: var(--countdown);
    }
    .status-chip {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--status-bg);
      color: var(--head-title);
      font-size: 12px;
      vertical-align: middle;
    }
    .status-chip.is-destroyed {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--status-destroyed-border);
    }
    .msg {
      padding: 10px 16px;
      margin: 0;
      display: flex;
      gap: 12px;
    }
    .sender {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .avatar-wrapper {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: none;
      display: block;
    }
    .sender-meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .sender-main {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: normal;
      display: flex;
      align-items: center;
    }
    .msg-time {
      margin-left: 8px;
      font-size: 11px;
      color: var(--msg-time);
    }
    .sender-sub {
      display: none;
    }
    .content-wrapper {
      background: var(--content-bg);
      border-radius: 8px;
      border-top-left-radius: 0;
      padding: 10px 14px;
      width: fit-content;
      max-width: 100%;
    }
    .content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.6;
      color: var(--head-title);
    }
    .reply-preview {
      margin: 0 0 10px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--muted);
      border-radius: 4px;
      background: var(--chip);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reply-preview::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
      flex: 0 0 auto;
    }
    .reply-preview-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.3;
      letter-spacing: .2px;
    }
    .cqface {
      height: 1.25em;
      width: 1.25em;
      vertical-align: -0.18em;
      object-fit: contain;
    }
    .fwd-image {
      display: block;
      max-width: 100%;
      max-height: 480px;
      border-radius: 4px;
      border: 1px solid var(--line);
      margin: 8px 0;
      background: var(--fwd-image-bg);
      object-fit: contain;
    }
    .fwd-image-link {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      line-height: 0;
      border-bottom: none;
      text-decoration: none;
      vertical-align: top;
    }
    .fwd-image-link:hover {
      border-bottom: none;
    }
    .fwd-image-open {
      cursor: zoom-in;
    }
    .fwd-image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 84px;
      padding: 12px 14px;
      border-radius: 4px;
      border: 1px dashed var(--line);
      margin: 8px 0;
      background: var(--chip);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .chip {
      display: inline-block;
      font-size: 12px;
      color: var(--asset-color);
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 8px;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    a.asset {
      color: var(--asset-color);
      text-decoration: none;
      border-bottom: 1px dashed var(--muted);
    }
    a.asset:hover {
      color: var(--asset-hover);
      border-bottom-color: var(--ink);
    }
    .media-block {
      margin: 8px 0;
    }
    .media-player {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 8px 0;
      border-radius: 4px;
      background: var(--chip);
    }
    .media-video {
      max-width: 100%;
    }
    .file-block {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--chip);
    }
    .file-name {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      margin: 2px 0 4px;
      word-break: break-word;
    }
    .file-meta {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 8px;
      word-break: break-all;
    }
    .asset.disabled {
      color: var(--asset-disabled);
      border-bottom: 1px dashed var(--muted);
      pointer-events: none;
      cursor: not-allowed;
    }
    .nested-forward {
      margin: 10px 0 6px;
      padding: 6px 12px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--chip);
    }
    .nested-forward-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--nested-title);
      letter-spacing: .2px;
      cursor: pointer;
      user-select: none;
      list-style: none;
      margin: 0;
    }
    .nested-forward-title::-webkit-details-marker {
      display: none;
    }
    .nested-forward-title::before {
      content: '▸';
      display: inline-block;
      margin-right: 6px;
      color: var(--accent);
      transition: transform .18s ease;
    }
    .nested-forward[open] .nested-forward-title {
      margin-bottom: 6px;
    }
    .nested-forward[open] .nested-forward-title::before {
      transform: rotate(90deg);
    }
    .nested-forward-body .msg {
      margin: 0;
      box-shadow: none;
    }

    /* Language support */
    .lang-zh, .lang-en { display: inline; }
    html:not(.lang-en) .lang-en { display: none; }
    html.lang-en .lang-zh { display: none; }
  </style>
</head>
<body>
  <button type="button" class="settings-toggle" id="settings-toggle" aria-label="Settings">⚙</button>
  <main class="page" id="forward-page-root">
    <section class="head">
      <h1>$title_html<span class="status-chip $page_state">$page_state_text</span></h1>
      <div class="meta">$meta_primary</div>
      <div class="meta sub">$meta_secondary<span id="destroy-countdown" class="destroy-countdown" data-created-at="$created_at_epoch" data-expires-at="$expires_at_epoch" data-destroyed-at="$destroyed_at_epoch"></span></div>
      <div class="meta sub">$meta_attachment</div>
    </section>
    <section>$body</section>
  </main>
  <div class="settings-overlay" id="settings-overlay" hidden>
    <div class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 class="settings-title" id="settings-title"><span class="lang-zh">界面设置</span><span class="lang-en">Interface Settings</span></h2>
        <button type="button" class="settings-close" id="settings-close"><span class="lang-zh">关闭</span><span class="lang-en">Close</span></button>
      </div>
      <div class="settings-list">
        <label class="setting-row" for="theme-select">
          <span class="setting-label"><span class="lang-zh">颜色模式</span><span class="lang-en">Color mode</span></span>
          <select class="setting-select" id="theme-select">
            <option value="system">跟随系统 / System</option>
            <option value="light">亮色 / Light</option>
            <option value="dark">暗色 / Dark</option>
          </select>
          <span class="setting-note"><span class="lang-zh">立即生效，并写入 LocalStorage。</span><span class="lang-en">Applied immediately and stored in LocalStorage.</span></span>
        </label>
        <label class="setting-row" for="forward-mode-select">
          <span class="setting-label"><span class="lang-zh">合并转发显示方式</span><span class="lang-en">Forward display mode</span></span>
          <select class="setting-select" id="forward-mode-select">
            <option value="nested">嵌套 / Nested</option>
            <option value="page">新页面 / Full screen</option>
          </select>
          <span class="setting-note"><span class="lang-zh">“新页面”会在点进嵌套消息时进入全屏查看。</span><span class="lang-en">Full screen opens nested forwards in an overlay viewer.</span></span>
        </label>
      </div>
    </div>
  </div>
  <div class="forward-overlay" id="forward-overlay" hidden>
    <div class="forward-overlay-bar">
      <button type="button" class="forward-back" id="forward-back" aria-label="Back">←</button>
      <div class="forward-overlay-title" id="forward-overlay-title"></div>
    </div>
    <div class="forward-overlay-body" id="forward-overlay-body"></div>
  </div>
  <script>
    (function () {
      var lang = (navigator.language || '').toLowerCase();
      var langIsZh = lang.startsWith('zh');
      if (!langIsZh) document.documentElement.classList.add('lang-en');

      var themeKey = "nextbridge.qq_forward.theme_mode";
      var modeKey = "nextbridge.qq_forward.forward_mode";
      var root = document.documentElement;
      var body = document.body;
      var pageRoot = document.getElementById("forward-page-root");
      var settingsButton = document.getElementById("settings-toggle");
      var settingsOverlay = document.getElementById("settings-overlay");
      var settingsClose = document.getElementById("settings-close");
      var themeSelect = document.getElementById("theme-select");
      var modeSelect = document.getElementById("forward-mode-select");
      var forwardOverlay = document.getElementById("forward-overlay");
      var forwardOverlayBody = document.getElementById("forward-overlay-body");
      var forwardOverlayTitle = document.getElementById("forward-overlay-title");
      var forwardBack = document.getElementById("forward-back");
      var forwardStack = [];

      function safeGet(key, fallback) {
        try {
          var value = localStorage.getItem(key);
          return value || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function safeSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {}
      }

      function resolveTheme(mode) {
        if (mode === "light" || mode === "dark") return mode;
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function applyTheme(mode) {
        root.dataset.themeMode = mode;
        root.dataset.theme = resolveTheme(mode);
        if (themeSelect) themeSelect.value = mode;
      }

      function exitForwardView() {
        if (!forwardOverlay || forwardOverlay.hidden) return;
        var rootState = forwardStack[0] || null;
        forwardStack = [];
        forwardOverlay.hidden = true;
        pageRoot.classList.remove("is-hidden");
        if (forwardOverlayBody) forwardOverlayBody.innerHTML = "";
        if (forwardOverlayTitle) forwardOverlayTitle.textContent = "";
        updateBackButton();
        if (rootState && Number.isFinite(rootState.scrollTop)) {
          window.scrollTo(0, rootState.scrollTop);
        }
      }

      function applyForwardMode(mode) {
        root.dataset.forwardMode = mode;
        if (modeSelect) modeSelect.value = mode;
        if (mode !== "page") {
          exitForwardView();
        }
      }

      function syncSettings() {
        var themeMode = safeGet(themeKey, "system");
        if (themeMode !== "system" && themeMode !== "light" && themeMode !== "dark") {
          themeMode = "system";
        }
        var forwardMode = safeGet(modeKey, "nested");
        if (forwardMode !== "nested" && forwardMode !== "page") {
          forwardMode = "nested";
        }
        applyTheme(themeMode);
        applyForwardMode(forwardMode);
      }

      function openSettings() {
        if (!settingsOverlay) return;
        settingsOverlay.hidden = false;
        body.classList.add("is-modal-open");
      }

      function closeSettings() {
        if (!settingsOverlay) return;
        settingsOverlay.hidden = true;
        body.classList.remove("is-modal-open");
      }

      function getNestedBody(detailsEl) {
        if (!detailsEl) return null;
        return detailsEl.querySelector(":scope > .nested-forward-body") || detailsEl.querySelector(".nested-forward-body");
      }

      function getNestedTitle(detailsEl) {
        if (!detailsEl) return langIsZh ? "嵌套合并转发" : "Nested Forward";
        var titleEl = detailsEl.querySelector(":scope > .nested-forward-title") || detailsEl.querySelector(".nested-forward-title");
        return titleEl ? titleEl.textContent.replace(/\s+/g, " ").trim() : (langIsZh ? "嵌套合并转发" : "Nested Forward");
      }

      function updateBackButton() {
        if (!forwardBack) return;
        forwardBack.hidden = !forwardOverlay || forwardOverlay.hidden;
      }

      function enterForwardView(detailsEl) {
        if (!forwardOverlay || !forwardOverlayBody || !forwardOverlayTitle) return;
        var bodyEl = getNestedBody(detailsEl);
        if (!bodyEl) return;

        var nextTitle = getNestedTitle(detailsEl);
        var nextHtml = bodyEl.innerHTML;

        if (forwardOverlay.hidden) {
          forwardStack = [{ kind: "root", scrollTop: window.scrollY }];
          pageRoot.classList.add("is-hidden");
          forwardOverlay.hidden = false;
        } else {
          forwardStack.push({
            kind: "view",
            title: forwardOverlayTitle.textContent,
            html: forwardOverlayBody.innerHTML,
            scrollTop: forwardOverlayBody.scrollTop,
          });
        }

        forwardOverlayTitle.textContent = nextTitle;
        forwardOverlayBody.innerHTML = nextHtml;
        forwardOverlayBody.scrollTop = 0;
        updateBackButton();
      }

      function goBackForwardView() {
        if (forwardStack.length <= 1) {
          exitForwardView();
          return;
        }

        forwardStack.pop();
        var previous = forwardStack[forwardStack.length - 1];
        if (!previous || previous.kind === "root") {
          exitForwardView();
          return;
        }

        forwardOverlayBody.innerHTML = previous.html;
        forwardOverlayTitle.textContent = previous.title;
        forwardOverlayBody.scrollTop = previous.scrollTop || 0;
        updateBackButton();
      }

      syncSettings();

      if (window.matchMedia) {
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        var onMediaChange = function () {
          if (root.dataset.themeMode === "system") {
            applyTheme("system");
          }
        };
        if (media.addEventListener) media.addEventListener("change", onMediaChange);
        else if (media.addListener) media.addListener(onMediaChange);
      }

      if (settingsButton) {
        settingsButton.setAttribute("aria-label", langIsZh ? "界面设置" : "Interface Settings");
        settingsButton.title = langIsZh ? "界面设置" : "Interface Settings";
        settingsButton.addEventListener("click", openSettings);
      }

      if (settingsClose) {
        settingsClose.addEventListener("click", closeSettings);
      }

      if (settingsOverlay) {
        settingsOverlay.addEventListener("click", function (event) {
          if (event.target === settingsOverlay) closeSettings();
        });
      }

      if (themeSelect) {
        themeSelect.addEventListener("change", function () {
          var mode = themeSelect.value;
          if (mode !== "system" && mode !== "light" && mode !== "dark") return;
          safeSet(themeKey, mode);
          applyTheme(mode);
        });
      }

      if (modeSelect) {
        modeSelect.addEventListener("change", function () {
          var mode = modeSelect.value;
          if (mode !== "nested" && mode !== "page") return;
          safeSet(modeKey, mode);
          applyForwardMode(mode);
        });
      }

      if (forwardBack) {
        forwardBack.setAttribute("aria-label", langIsZh ? "返回上一层" : "Back");
        forwardBack.title = langIsZh ? "返回上一层" : "Back";
        forwardBack.addEventListener("click", goBackForwardView);
      }

      document.addEventListener("click", function (event) {
        var titleEl = event.target.closest(".nested-forward-title");
        if (!titleEl || root.dataset.forwardMode !== "page") return;
        var detailsEl = titleEl.closest(".nested-forward");
        if (!detailsEl) return;
        event.preventDefault();
        event.stopPropagation();
        enterForwardView(detailsEl);
      });

      document.addEventListener("keydown", function (event) {
        if (root.dataset.forwardMode !== "page") return;
        if (event.key !== "Enter" && event.key !== " ") return;
        var titleEl = event.target.closest(".nested-forward-title");
        if (!titleEl) return;
        var detailsEl = titleEl.closest(".nested-forward");
        if (!detailsEl) return;
        event.preventDefault();
        enterForwardView(detailsEl);
      });

      var countdown = document.getElementById("destroy-countdown");
      var expiresAt = countdown ? parseInt(countdown.getAttribute("data-expires-at") || "", 10) : NaN;
      var destroyedAt = countdown ? parseInt(countdown.getAttribute("data-destroyed-at") || "", 10) : NaN;
      var statusChip = document.querySelector(".status-chip");
      var timer = null;

      function formatDuration(seconds) {
        var remain = Math.max(0, Math.floor(seconds));
        var days = Math.floor(remain / 86400);
        remain = remain % 86400;
        var hours = Math.floor(remain / 3600);
        remain = remain % 3600;
        var minutes = Math.floor(remain / 60);
        var secs = remain % 60;
        var parts = [];
        if (langIsZh) {
          if (days > 0) parts.push(days + "\u5929");
          if (hours > 0 || parts.length > 0) parts.push(hours + "\u5c0f\u65f6");
          if (minutes > 0 || parts.length > 0) parts.push(minutes + "\u5206\u949f");
          parts.push(secs + "\u79d2");
        } else {
          if (days > 0) parts.push(days + "d");
          if (hours > 0 || parts.length > 0) parts.push(hours + "h");
          if (minutes > 0 || parts.length > 0) parts.push(minutes + "m");
          parts.push(secs + "s");
        }
        return parts.join(langIsZh ? "" : " ");
      }

      function setDestroyed() {
        if (statusChip) {
          statusChip.classList.add("is-destroyed");
          statusChip.classList.remove("active");
        }
      }

      if (countdown && Number.isFinite(expiresAt) && expiresAt > 0) {
        if (Number.isFinite(destroyedAt) && destroyedAt > 0) {
          countdown.textContent = langIsZh ? " · \u5df2\u9500\u6bc1" : " · Destroyed";
          setDestroyed();
        } else {
          function tick() {
            var now = Math.floor(Date.now() / 1000);
            var remain = expiresAt - now;
            if (remain <= 0) {
              countdown.textContent = langIsZh ? " · \u5df2\u9500\u6bc1" : " · Destroyed";
              setDestroyed();
              if (timer) clearInterval(timer);
              return;
            }
            countdown.textContent = (
              (langIsZh ? " · \u8ddd\u79bb\u9500\u6bc1\u7ea6 " : " · Destroy in approx. ")
              + formatDuration(remain)
            );
          }

          tick();
          timer = setInterval(tick, 1000);
        }
      }
    })();
  </script>
</body>
</html>
